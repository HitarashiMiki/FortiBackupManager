version: '3.8'

services:
  fortibackup-web:
    build: .
    container_name: WebBackupManager
    ports:
      - "8080:8000"
    volumes:
      - fortibackup-data:/root/.fortibackup-web
      # Path to your database folder /folder/on/host:/DB
      - ./db:/DB
    environment:
      - TZ=Europe/Warsaw
    restart: unless-stopped

volumes:
  fortibackup-data:
